name: Daily Intelligence Digest

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  digest:
    name: Generate Daily Technology Digest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Compile and Verify Daily Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Generating daily technology summary..."

      - name: Commit Daily Digest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(digest): publish daily technology digest [skip ci]"
          file_pattern: "data/digests/*"
