name: TechFossil Ingestion Pipeline

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Target Source Adapter'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - github_releases
          - npm_registry
          - arxiv_cs
          - cve_security
          - pypi_registry

concurrency:
  group: ingestion-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    name: Run Verified Ingestion Cycle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute 14-Stage Ingestion Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm run ingest -- --source=${{ github.event.inputs.source || 'all' }}

      - name: Check for Dataset Changes & Commit
        run: |
          git config --local user.email "bot@techfossil.org"
          git config --local user.name "techfossil-bot"
          
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "New verified records detected. Committing changes..."
            git add data/
            git commit -m "chore(archive): sync verified upstream records [skip ci]"
            git push
          else
            echo "No new records to commit. Ledger is fully synchronized."
          fi
