name: Automated Ecosystem Ingestion

on:
  schedule:
    # Run every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Target source adapter (default: all)'
        required: false
        default: 'all'

jobs:
  ingest:
    name: Execute 14-Stage Ingestion Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Ingestion Pipeline Cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run ingest ${{ github.event.inputs.source || 'all' }}

      - name: Commit Verified Signal Records
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat(data): ingest verified technology signals [skip ci]"
          file_pattern: "data/*"
